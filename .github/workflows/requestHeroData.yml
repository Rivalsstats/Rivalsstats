# This is a basic workflow to help you get started with Actions

name: request Hero Data

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  schedule:
    - cron: "50 23 * * *"  # Runs at 23:55 every day

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    env:
      BASE_URL: "https://marvelrivalsapi.com/api/v1/"
      API_TOKEN: ${{ secrets.MARVEL_RIVALS_KEY }}
      MAPS_URL: "heroes"

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Fetch Marvel Rivals Hero Stats
        run: |
          curl -H "x-api-key: ${API_TOKEN}" -X GET "${BASE_URL}${MAPS_URL}" -o data/latest/latest_heroes.json

      - name: Download Hero Icons
        run: |
          # Ensure the destination directory exists
          mkdir -p icons/hero_icons
          # Loop through each hero from the JSON response
          cat data/latest/latest_heroes.json | jq -c '.[]' | while read -r hero; do
            # Extract the name and replace spaces with underscores
            name=$(echo "$hero" | jq -r '.name' | tr ' ' '_')
            # Extract the imageUrl field (assumed relative URL) and build the full URL
            imageUrl=$(echo "$hero" | jq -r '.imageUrl')
            fullUrl="${BASE_URL}${imageUrl}"
            echo "Downloading icon for $name from $fullUrl..."
            curl -sSL "$fullUrl" -o "icons/hero_icons/${name}.png"
          done

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git config pull.rebase true   # rebase
          git add data/
          git commit -m "Updated Heroes" || echo "No changes to commit"
          git pull || echo "No changes to pull"
          git push || echo "No changes to push"
               
