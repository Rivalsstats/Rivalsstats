# This is a basic workflow to help you get started with Actions
 
 name: request Heroes
 
 # Controls when the workflow will run
 on:
   # Triggers the workflow on push or pull request events but only for the "main" branch
   schedule:
     - cron: "50 23 * * *"  # Runs at 23:55 every day
 
   # Allows you to run this workflow manually from the Actions tab
   workflow_dispatch:
 
 # A workflow run is made up of one or more jobs that can run sequentially or in parallel
 jobs:
   # This workflow contains a single job called "build"
   build:
     # The type of runner that the job will run on
     runs-on: ubuntu-latest
     env:
       BASE_URL: "https://marvelrivalsapi.com/api/v1/"
       API_TOKEN: ${{ secrets.MARVEL_RIVALS_KEY }}
       IMAGE_URL: "https://marvelrivalsapi.com/rivals"
       HEROES_URL: "heroes"
 
     # Steps represent a sequence of tasks that will be executed as part of the job
     steps:
       # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
       - uses: actions/checkout@v4
 
       - name: Fetch Marvel Rivals Hero Stats
         run: |
           curl -H "x-api-key: ${API_TOKEN}" -X GET "${BASE_URL}${HEROES_URL}" -o data/latest/latest_heroes.json

       - name: Fetch and validate Marvel Rivals Hero Stats
         run: |
            set -euo pipefail

            # fetch, fail on HTTP >=400, write raw JSON to a temp file
            curl --fail -sS \
              -H "x-api-key: ${API_TOKEN}" \
              "${BASE_URL}${HEROES_URL}" \
              -o temp_heroes.json

            # validate it's valid JSON
            jq . temp_heroes.json > data/latest/latest_heroes.json

            # clean up
            rm temp_heroes.json

 
       - name: Download and Convert Hero Transformation Icons (id 0)
         run: |
           # Install ImageMagick for converting WebP to PNG
           sudo apt-get update && sudo apt-get install -y imagemagick
           # Ensure the destination directory exists
           mkdir -p icons/hero_icons
           # Loop through each hero in the JSON response
           cat data/latest/latest_heroes.json | jq -c '.[]' | while read -r hero; do
             # Extract the hero name and replace spaces with underscores
             hero_name=$(echo "$hero" | jq -r '.name' | tr ' ' '_')
             # Extract the icon URL from the transformation with id "0"
             transformation_icon=$(echo "$hero" | jq -r '.transformations[] | select(.id=="0") | .icon')
             if [ -z "$transformation_icon" ]; then
               echo "No transformation with id 0 found for hero $hero_name, skipping..."
               continue
             fi
             # Build the full URL (assumes the transformation icon is a relative path)
             icon_url="${IMAGE_URL}${transformation_icon}"
             echo "Downloading transformation icon for $hero_name from $icon_url..."
             # Download the WebP image temporarily
             curl -sSL "$icon_url" -o tmp_icon.webp
             # Convert the WebP image to PNG format and save with hero name
             convert tmp_icon.webp "icons/hero_icons/${hero_name,,}.png"
             # Remove the temporary WebP file
             rm tmp_icon.webp
           done
 
       - name: Commit and push changes
         run: |
           git config --global user.name "github-actions"
           git config --global user.email "github-actions@github.com"
           git config pull.rebase true   # rebase
           git add data/
           git add icons/
           git commit -m "Updated Heroes" || echo "No changes to commit"
           git pull || echo "No changes to pull"
           git push || echo "No changes to push"
