# This is a basic workflow to help you get started with Actions

name: request Maps

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  schedule:
    - cron: "50 23 * * *"  # Runs at 23:55 every day

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    env:
      BASE_URL: "https://marvelrivalsapi.com/api/v1/"
      API_TOKEN: ${{ secrets.MARVEL_RIVALS_KEY }}
      MAPS_URL: "maps?limit=9999"

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Fetch and validate Marvel Rivals maps
        run: |
          set -euo pipefail

          # fetch, fail on HTTP >=400, write raw JSON to a temp file
          curl --fail -sS \
            -H "x-api-key: ${API_TOKEN}" \
            "${BASE_URL}${MAPS_URL}" \
            -o temp_maps.json

          # validate it's valid JSON
          jq . temp_maps.json > data/latest/latest_maps.json

          # clean up
          rm temp_maps.json


      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git config pull.rebase true   # rebase
          git add data/
          git commit -m "Updated Maps" || echo "No changes to commit"
          git pull || echo "No changes to pull"
          git push || echo "No changes to push"
               
