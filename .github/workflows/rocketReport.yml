name: Rocket Report

on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  schedule:
    - cron: "00 12 * * *"  # Runs at 18:00 every day

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      social_text: ${{ steps.gen_social.outputs.social_text }}
    steps:  
      - name: Clone project
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # gets git history for changelogs
          token: ${{ secrets.WORKFLOW_TOKEN }} 
      - name: Get Time
        id: get_time
        shell: bash
        run: |
          echo "start_time=$(TZ=":Europe/Berlin" date '+%m/%d/%Y')" >> $GITHUB_OUTPUT
      - name: Extract rocket info
        id: extract_rocket
        run: |
              overall=$(jq -r '.rocket_overall_winrate[0]' rendered/data.json | xargs)
              one_def=$(jq -r '.rocket_win_rate_one_defensive[0]' rendered/data.json | xargs)
              no_pun=$(jq -r '.rocket_win_rate_no_punisher[0]' rendered/data.json | xargs)
              with_pun=$(jq -r '.rocket_win_rate_with_punisher[0]' rendered/data.json | xargs)

              report="Date: ${{ steps.get_time.outputs.start_time }}
              Rocket Raccoon stats
              Rocket Overall Winrate: $overall%
              Winrate with only one Defensive Ult: $one_def%
              Winrate without Ammo Overload: $no_pun%
              Winrate with Ammo Overload: $with_pun%"

              # escape newlines for GitHub output
              report_escaped=$(echo \"$report\")

              echo \"data=$report_escaped\" >> $GITHUB_OUTPUT
          
      - name: Generate Rocket social text with OpenRouter
        id: gen_social
        run: |
          pip install openai openrouter
          python backend_scripts/llm_post.py \
            --api-key "${{ secrets.OPENROUTER_API_KEY }}" \
            --data "${{ steps.extract_rocket.outputs.data }}" \
            --url "https://rivalsstats.com/" \
            > post.txt
          echo "social_text<<EOF" >> $GITHUB_OUTPUT
          cat post.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

            
  twitter:
    needs: setup
    runs-on: ubuntu-latest
    steps:  
      - name: Clone project
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # gets git history for changelogs
          token: ${{ secrets.WORKFLOW_TOKEN }} 
      - uses: nearform-actions/github-action-notify-twitter@v1.2.3
        with:
          message: ${{ needs.setup.outputs.social_text }}
          twitter-app-key: ${{ secrets.TWITTER_APP_KEY }}
          twitter-app-secret: ${{ secrets.TWITTER_APP_SECRET }}
          twitter-access-token: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          twitter-access-token-secret: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          media: |
            ./rendered/RocketHate.png
          media-alt-text: |
            Rocket Stats
  reddit:
      runs-on: ubuntu-latest
      needs: setup
      steps:
        - name: reddit
          uses: meysam81/reddit-scheduled-submit@v1.1.1
          with:
            username: ${{ secrets.REDDIT_USERNAME }}
            password: ${{ secrets.REDDIT_PASSWORD }}
            client-id: ${{ secrets.REDDIT_APP_ID }}
            client-secret: ${{ secrets.REDDIT_APP_SECRET }}
            subreddit: ${{ secrets.REDDIT_SUBREDDIT }}
            title: "🔥 Rocket Report for ${{ needs.setup.outputs.start_time }}! 🔥"
            message: ${{ needs.setup.outputs.social_text }}
  bsky-post:
      runs-on: ubuntu-latest
      needs: setup
      steps:
        - name: Clone project
          uses: actions/checkout@v3
          with:
            fetch-depth: 0  # gets git history for changelogs
            token: ${{ secrets.WORKFLOW_TOKEN }} 

        # Install pngquant for image compression
        - name: Install pngquant
          run: |
            sudo apt-get update
            sudo apt-get install -y pngquant
    
        # Compress the PNG file to reduce its size
        - name: Compress RocketHate.png
          run: |
            pngquant --quality=65-80 --force --output ./rendered/RocketHate-compressed.png ./rendered/RocketHate.png

        - uses: myConsciousness/bluesky-post@v5
          with:
            text: ${{ needs.setup.outputs.social_text }}
            media: "./rendered/RocketHate-compressed.png"
            media-alt: "Rocket Stats"
            identifier: ${{ secrets.BLUESKY_IDENTIFIER }}
            password: ${{ secrets.BLUESKY_PASSWORD }}
            link-preview-url: "https://rivalsstats.com"
            tags: "marvel,rivals,rocket,data-science"
